name: Deploy — ML Service (Modal)

on:
  push:
    branches: [main]
    paths:
      - "apps/ml/**"

concurrency:
  group: deploy-ml
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ML Service to Modal
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: apps/ml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Modal CLI
        run: pip install modal

      - name: Authenticate with Modal
        run: modal token set --token-id ${{ secrets.MODAL_TOKEN_ID }} --token-secret ${{ secrets.MODAL_TOKEN_SECRET }}

      - name: Deploy to Modal
        run: modal deploy modal_deploy.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET_MEDIA: ${{ secrets.S3_BUCKET_MEDIA }}
          ML_SERVICE_API_KEY: ${{ secrets.ML_SERVICE_API_KEY }}
