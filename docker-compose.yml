# Local dev stack for ClipHive. Credentials come from the environment
# (see "Local Docker Compose" section in .env.example); defaults below are
# dev-only values so `docker compose up` still works out of the box.
# Never commit real credentials — copy .env.example to .env for local use.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cliphive-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cliphive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cliphive_local}
      POSTGRES_DB: ${POSTGRES_DB:-cliphive_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-cliphive} -d $${POSTGRES_DB:-cliphive_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cliphive-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    # Pinned: do not use :latest (breaks reproducible local dev).
    image: minio/minio:RELEASE.2024-08-17T01-43-54Z
    container_name: cliphive-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cliphive_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cliphive_minio_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2024-08-11T11-46-51Z
    container_name: cliphive-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cliphive_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cliphive_minio_secret}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\";
      mc mb local/cliphive-media --ignore-existing;
      mc mb local/cliphive-renders --ignore-existing;
      mc anonymous set download local/cliphive-renders;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
